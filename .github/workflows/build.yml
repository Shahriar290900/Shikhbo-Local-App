name: Build installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: shikhbo-local.dmg
          - os: windows-latest
            artifact_name: shikhbo-local.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.11'
          auto-activate-base: true
          activate-environment: shikhbo

      - name: Install faiss via conda (pre-built, no SWIG needed)
        shell: bash -el {0}
        run: conda install -y -c conda-forge faiss-cpu

      - name: Install Python dependencies
        shell: bash -el {0}
        run: |
          pip install flask flask-cors rank-bm25 \
            "langchain-core>=0.3" "langchain-community>=0.3" \
            langdetect platformdirs pywebview faster-whisper \
            requests python-dotenv werkzeug numpy pyinstaller

      - name: Build with PyInstaller
        shell: bash -el {0}
        run: pyinstaller shikhbo.spec --noconfirm --clean

      # ── macOS: create .dmg ───────────────────────────────────────────────
      - name: Create .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg || true
          if create-dmg \
            --volname "Shikhbo Local" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 185 \
            shikhbo-local.dmg \
            dist/Shikhbo.app; then
            echo "create-dmg succeeded"
          else
            hdiutil create \
              -volname "Shikhbo Local" \
              -srcfolder dist/Shikhbo.app \
              -ov -format UDZO \
              shikhbo-local.dmg
          fi

      # ── Windows: package dist folder as installer ────────────────────────
      - name: Create Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "installer.nsi") {
            choco install nsis --no-progress -y
            & makensis /V1 /DOUTFILE="shikhbo-local.exe" /DAPP_DIR="dist\Shikhbo" installer.nsi
          }

      - name: Fallback — zip Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "shikhbo-local.exe")) {
            Compress-Archive -Path dist\Shikhbo\* -DestinationPath shikhbo-local.zip -Force
            Rename-Item shikhbo-local.zip shikhbo-local.exe
            Write-Host "Created shikhbo-local.exe (zip package)"
          }

      # ── Upload to GitHub release ─────────────────────────────────────────
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
