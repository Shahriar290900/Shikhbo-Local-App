name: Build installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Shikhbo.dmg
            asset_name: Shikhbo-macOS.dmg
          - os: windows-latest
            artifact_name: Shikhbo-installer.exe
            asset_name: Shikhbo-Windows-installer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller shikhbo.spec --noconfirm

      # ── macOS: create .dmg ───────────────────────────────────────────────
      - name: Create .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "Shikhbo" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 185 \
            Shikhbo.dmg \
            dist/Shikhbo.app \
          || hdiutil create -volname Shikhbo -srcfolder dist/Shikhbo.app \
               -ov -format UDZO Shikhbo.dmg

      # ── Windows: create installer with NSIS ─────────────────────────────
      - name: Create Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          makensis /V1 /DOUTFILE="Shikhbo-installer.exe" /DAPP_DIR="dist\Shikhbo" installer.nsi
        continue-on-error: true

      - name: Fallback — zip Windows build
        if: runner.os == 'Windows'
        run: |
          if not exist "Shikhbo-installer.exe" (
            powershell Compress-Archive -Path dist\Shikhbo -DestinationPath Shikhbo-installer.exe
          )
        shell: cmd

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
